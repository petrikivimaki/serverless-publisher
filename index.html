<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Papyrus is a serverless markdown knowledge base frontend for Obsidian & GitHub Pages."
        />
        <meta name="application-name" content="Papyrus" />
        <meta name="generator" content="Papyrus" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="robots" content="index, follow" />
        <meta name="color-scheme" content="dark light" />
        <meta name="theme-color" content="RGB(17,24,39)" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Papyrus" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="format-detection" content="telephone=no" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Papyrus" />
        <meta property="og:title" content="Papyrus" />
        <meta
            property="og:description"
            content="Papyrus is a serverless markdown knowledge base frontend for Obsidian & GitHub Pages."
        />
        <meta property="og:url" content="https://petrikivimaki.github.io/" />
        <meta property="og:locale" content="en_US" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Papyrus" />
        <meta
            name="twitter:description"
            content="Papyrus is a serverless markdown knowledge base frontend for Obsidian & GitHub Pages."
        />
        <link rel="canonical" href="https://petrikivimaki.github.io/" />
        <title>Papyrus</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism-tomorrow.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.12.0/dist/maplibre-gl.css"
        />
		<link rel="stylesheet" href="styles/main.css?v=16" />
		<script type="module" src="scripts/app.js?v=16"></script>
    </head>
    <body>
		<div class="app-shell">
			<aside class="left-panel" data-left-panel>
				<header class="panel-header">
					<div>
						<p class="eyebrow" data-vault-source>Local vault</p>
						<h1 data-vault-title>Papyrus</h1>
					</div>
					<div class="panel-header-actions">
						<button
							class="icon-button"
							type="button"
							data-action="refresh"
							data-cuelume-hover="tick"
							data-cuelume-toggle="loading"
							aria-label="Refresh content"
							title="Refresh content"
						>
							<i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
						</button>
						<button
							class="icon-button"
							type="button"
							data-action="close-left"
							data-cuelume-hover="tick"
							data-cuelume-toggle="droplet"
							aria-label="Close primary menu"
							title="Close primary menu"
						>
							<i class="fa-solid fa-xmark" aria-hidden="true"></i>
						</button>
					</div>
				</header>

				<nav class="panel-tabs" aria-label="Primary menu views">
					<button type="button" data-panel="files" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Library" title="Library">
						<i class="fa-solid fa-folder-tree" aria-hidden="true"></i>
					</button>
					<button type="button" data-panel="search" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Search" title="Search">
						<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
					</button>
					<button type="button" data-panel="calendar" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Calendar" title="Calendar">
						<i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
					</button>
					<button type="button" data-panel="bookmarks" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Bookmarks" title="Bookmarks">
						<i class="fa-regular fa-bookmark" aria-hidden="true"></i>
					</button>
					<button type="button" data-panel="graph" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Graph" title="Graph">
						<i class="fa-solid fa-diagram-project" aria-hidden="true"></i>
					</button>
					<button type="button" data-panel="linktree" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Links" title="Links">
						<i class="fa-solid fa-link" aria-hidden="true"></i>
					</button>
				</nav>

                <section
                    class="panel-view is-active"
                    data-view="files"
                    aria-label="Files"
                >
                    <div class="vault-toolbar">
                        <h2>Vault</h2>
                        <div class="vault-toolbar-actions">
                            <span class="vault-note-count" data-vault-note-count></span>
                            <button
                                class="icon-button"
                                type="button"
                                data-action="open-all-folders"
                                data-cuelume-hover="tick"
                                data-cuelume-toggle="toggle"
                                aria-label="Open all folders"
                                title="Open all folders"
                            >
                                <i class="fa-solid fa-angles-down" aria-hidden="true"></i>
                            </button>
                            <button
                                class="icon-button"
                                type="button"
                                data-action="close-all-folders"
                                data-cuelume-hover="tick"
                                data-cuelume-toggle="toggle"
                                aria-label="Close all folders"
                                title="Close all folders"
                            >
                                <i class="fa-solid fa-angles-up" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <nav
                        class="file-tree"
                        data-file-tree
                        aria-label="Markdown files"
                    ></nav>
                </section>

                <section
                    class="panel-view"
                    data-view="search"
                    aria-label="Search"
                >
                    <div class="panel-toolbar">
                        <label class="field">
                            <input
                                type="search"
                                data-search-input
                                placeholder="Search everything..."
                                aria-label="Search vault"
                                role="combobox"
                                aria-autocomplete="list"
                                aria-controls="vault-search-results"
                                aria-expanded="false"
                            />
                        </label>
                    </div>
                    <div
                        class="search-results"
                        id="vault-search-results"
                        data-search-results
                        role="listbox"
                        aria-label="Search results"
                    ></div>
                </section>

                <section
                    class="panel-view"
                    data-view="calendar"
                    aria-label="Calendar"
                >
                    <div class="calendar-panel">
                        <div class="calendar-toolbar">
                            <button
                                class="icon-button"
                                type="button"
                                data-action="previous-month"
                                aria-label="Previous month"
                                title="Previous month"
                            >
                                <i
                                    class="fa-solid fa-chevron-left"
                                    aria-hidden="true"
                                ></i>
                            </button>
                            <button
                                class="today-button"
                                type="button"
                                data-action="current-month"
                            >
                                <span
                                    class="calendar-current"
                                    data-calendar-title
                                ></span>
                            </button>
                            <button
                                class="icon-button"
                                type="button"
                                data-action="next-month"
                                aria-label="Next month"
                                title="Next month"
                            >
                                <i
                                    class="fa-solid fa-chevron-right"
                                    aria-hidden="true"
                                ></i>
                            </button>
                        </div>
                        <div
                            class="calendar-grid calendar-weekdays"
                            data-calendar-weekdays
                            aria-hidden="true"
                        ></div>
                        <div
                            class="calendar-grid calendar-days"
                            data-calendar-days
                        ></div>
                    </div>
                </section>

                <section
                    class="panel-view"
                    data-view="bookmarks"
                    aria-label="Bookmarks"
                >
                    <div class="panel-toolbar">
                        <button
                            class="danger-button"
                            type="button"
                            data-action="clear-bookmarks"
                        >
                            <i
                                class="fa-solid fa-trash-can"
                                aria-hidden="true"
                            ></i>
                            <span>Remove all bookmarks</span>
                        </button>
                    </div>
                    <div class="bookmarks-list" data-bookmarks-list></div>
                </section>

                <section
                    class="panel-view"
                    data-view="graph"
                    aria-label="Graph"
                >
                    <div class="graph-list" data-graph-list></div>
                </section>

                <section
                    class="panel-view"
                    data-view="linktree"
                    aria-label="Linktree"
                >
                    <div class="linktree-list" data-linktree-list></div>
                </section>
            </aside>

            <main class="workspace">
                <article class="article" data-article>
                    <div class="empty-state">
                        <i
                            class="fa-regular fa-file-lines"
                            aria-hidden="true"
                        ></i>
                        <h2>Select a note</h2>
                        <p>
                            Choose a markdown file from the vault to start
                            reading.
                        </p>
                    </div>
                </article>
            </main>

			<aside class="right-panel" data-right-panel>
				<header class="panel-header">
					<div>
						<p class="eyebrow">Context</p>
						<h2>Article info</h2>
					</div>
					<button
						class="icon-button"
						type="button"
						data-action="toggle-right"
						data-cuelume-hover="tick"
						data-cuelume-toggle="droplet"
						aria-label="Close secondary menu"
						title="Close secondary menu"
					>
						<i class="fa-solid fa-xmark" aria-hidden="true"></i>
					</button>
				</header>
                <section
                    class="info-section qr-code-block"
                    data-qr-code-block
                    hidden
                >
                    <h3>QR Code</h3>
                    <div class="qr-code-card">
                        <img
                            src=""
                            alt="QR code generated from selected text"
                            data-qr-code-image
                        />
                        <p data-qr-code-summary></p>
                    </div>
                </section>
                <section class="info-section">
                    <h3>Bookmark</h3>
                    <button
                        class="bookmark-button"
                        type="button"
                        data-action="toggle-bookmark"
                        disabled
                    >
                        <i
                            class="fa-regular fa-bookmark"
                            aria-hidden="true"
                            data-bookmark-icon
                        ></i>
                        <span data-bookmark-label>Bookmark note</span>
                    </button>
                </section>
                <section class="info-section">
                    <h3>Source</h3>
                    <div class="source-links">
                        <a
                            class="source-link"
                            href="#"
                            target="_blank"
                            rel="noreferrer"
                            data-source-repo-link
                        >
                            <i
                                class="fa-brands fa-github"
                                aria-hidden="true"
                            ></i>
                            <span>Repository</span>
                        </a>
                        <a
                            class="source-link"
                            href="#"
                            target="_blank"
                            rel="noreferrer"
                            data-source-article-link
                        >
                            <i
                                class="fa-regular fa-file-code"
                                aria-hidden="true"
                            ></i>
                            <span>Article file</span>
                        </a>
                    </div>
                    <div class="source-actions">
                        <button
                            class="source-button"
                            type="button"
                            data-action="copy-source-url"
                            disabled
                        >
                            <i
                                class="fa-regular fa-copy"
                                aria-hidden="true"
                            ></i>
                            <span>Copy article URL</span>
                        </button>
                        <button
                            class="source-button"
                            type="button"
                            data-action="copy-published-url"
                            disabled
                        >
                            <i class="fa-solid fa-globe" aria-hidden="true"></i>
                            <span>Copy site URL</span>
                        </button>
                        <button
                            class="source-button"
                            type="button"
                            data-action="copy-article-content"
                            disabled
                        >
                            <i
                                class="fa-regular fa-file-lines"
                                aria-hidden="true"
                            ></i>
                            <span>Copy article content</span>
                        </button>
                        <button
                            class="source-button"
                            type="button"
                            data-action="open-obsidian"
                            disabled
                        >
                            <i
                                class="fa-solid fa-diamond"
                                aria-hidden="true"
                            ></i>
                            <span>Open in Obsidian</span>
                        </button>
                        <a
                            class="source-button source-download-link is-disabled"
                            href="#"
                            download
                            data-source-download-link
                            aria-disabled="true"
                        >
                            <i
                                class="fa-solid fa-download"
                                aria-hidden="true"
                            ></i>
                            <span>Download article</span>
                        </a>
                    </div>
                </section>
				<section class="info-section">
                    <h3>Metadata</h3>
                    <dl class="metadata-list" data-metadata-list></dl>
                </section>
                <section class="info-section">
                    <h3>Table of Contents</h3>
                    <nav
                        class="toc-list"
                        data-toc-list
                        aria-label="Table of contents"
                    ></nav>
                </section>
                <section class="info-section">
                    <h3>Backlinks</h3>
                    <div class="link-list" data-backlink-list></div>
                </section>
                <section class="info-section">
                    <h3>Outgoing links</h3>
                    <div class="link-list" data-outgoing-list></div>
                </section>
			</aside>
		</div>

		<div class="floating-navigation-wrap">
			<section
				id="quick-settings"
				class="quick-settings"
				data-quick-settings
				aria-label="Content appearance"
				hidden
			>
				<div class="settings-row">
					<span>Theme</span>
					<div class="settings-options theme-options" aria-label="Theme">
						<button type="button" data-theme-choice="light" aria-label="Light theme" title="Light theme">
							<i class="fa-regular fa-sun" aria-hidden="true"></i>
						</button>
						<button type="button" data-theme-choice="sand" aria-label="Sand theme" title="Sand theme">
							<i class="fa-solid fa-wheat-awn" aria-hidden="true"></i>
						</button>
						<button type="button" data-theme-choice="ocean" aria-label="Ocean theme" title="Ocean theme">
							<i class="fa-solid fa-water" aria-hidden="true"></i>
						</button>
						<button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme">
							<i class="fa-regular fa-moon" aria-hidden="true"></i>
						</button>
					</div>
				</div>
				<div class="settings-row">
					<span>Sound</span>
					<div class="settings-options sound-options" aria-label="Sound effects">
						<button type="button" data-sound-choice="on" aria-label="Sound effects on" title="Sound effects on">
							<i class="fa-solid fa-volume-high" aria-hidden="true"></i>
						</button>
						<button type="button" data-sound-choice="off" aria-label="Sound effects off" title="Sound effects off">
							<i class="fa-solid fa-volume-xmark" aria-hidden="true"></i>
						</button>
					</div>
				</div>
				<fieldset class="settings-row">
					<legend>Typeface</legend>
					<div class="settings-options" aria-label="Typeface">
						<label title="Literary — Georgia">
							<input type="radio" name="content-typeface" value="literary" data-font-family aria-label="Literary — Georgia" />
							<span class="is-literary">Ag</span>
						</label>
						<label title="Modern — Arial">
							<input type="radio" name="content-typeface" value="modern" data-font-family aria-label="Modern — Arial" />
							<span class="is-modern">Ag</span>
						</label>
						<label title="Monospace — Courier New">
							<input type="radio" name="content-typeface" value="monospace" data-font-family aria-label="Monospace — Courier New" />
							<span class="is-monospace">Ag</span>
						</label>
					</div>
				</fieldset>
				<fieldset class="settings-row">
					<legend>Alignment</legend>
					<div class="settings-options" aria-label="Text alignment">
						<label title="Align left">
							<input type="radio" name="text-orientation" value="left" data-text-orientation />
							<i class="fa-solid fa-align-left" aria-hidden="true"></i>
						</label>
						<label title="Align center">
							<input type="radio" name="text-orientation" value="center" data-text-orientation />
							<i class="fa-solid fa-align-center" aria-hidden="true"></i>
						</label>
						<label title="Justify text">
							<input type="radio" name="text-orientation" value="justify" data-text-orientation />
							<i class="fa-solid fa-align-justify" aria-hidden="true"></i>
						</label>
						<label title="Align right">
							<input type="radio" name="text-orientation" value="right" data-text-orientation />
							<i class="fa-solid fa-align-right" aria-hidden="true"></i>
						</label>
					</div>
				</fieldset>
				<label class="settings-range">
					<span>Size</span>
					<input type="range" min="14" max="24" step="1" value="18" data-font-size />
					<output data-font-size-value>18px</output>
				</label>
				<label class="settings-range">
					<span>Leading</span>
					<input type="range" min="1.2" max="2.2" step="0.05" value="1.68" data-line-height />
					<output data-line-height-value>1.68</output>
				</label>
				<label class="settings-range">
					<span>Measure</span>
					<input type="range" min="560" max="960" step="20" value="820" data-content-width />
					<output data-content-width-value>820px</output>
				</label>
			</section>

			<nav class="floating-navigation" aria-label="Main navigation">
				<button type="button" data-action="open-home" data-cuelume-hover="tick" data-cuelume-toggle="page" aria-label="Home" title="Home">
					<i class="fa-solid fa-house" aria-hidden="true"></i>
					<span>Home</span>
				</button>
				<button type="button" data-panel="files" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Library" title="Library">
					<i class="fa-solid fa-folder-tree" aria-hidden="true"></i>
					<span>Library</span>
				</button>
				<button type="button" data-panel="search" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Search" title="Search">
					<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
					<span>Search</span>
				</button>
				<button type="button" data-action="scroll-top" data-cuelume-hover="tick" data-cuelume-toggle="droplet" aria-label="Scroll to top" title="Scroll to top" hidden>
					<i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
					<span>Top</span>
				</button>
				<span class="navigation-divider" aria-hidden="true"></span>
				<button type="button" data-action="toggle-right" data-cuelume-hover="tick" data-cuelume-toggle aria-label="Article details" title="Article details">
					<i class="fa-solid fa-sliders" aria-hidden="true"></i>
					<span>Details</span>
				</button>
				<button
					type="button"
					data-action="toggle-settings"
					data-theme-toggle
					data-cuelume-hover="tick"
					data-cuelume-toggle
					aria-label="Quick settings"
					aria-controls="quick-settings"
					aria-expanded="false"
					title="Quick settings"
				>
					<i class="fa-solid fa-gear" aria-hidden="true"></i>
					<span>Settings</span>
				</button>
			</nav>
		</div>

        <div class="selection-menu" data-selection-menu hidden>
            <div class="selection-count" data-selection-count>0 characters</div>
            <div class="selection-actions">
                <button type="button" data-action="copy-selection">
                    <i class="fa-regular fa-copy" aria-hidden="true"></i>
                    <span>Copy</span>
                </button>
                <button type="button" data-action="qr-selection">
                    <i class="fa-solid fa-qrcode" aria-hidden="true"></i>
                    <span>QR code</span>
                </button>
                <button type="button" data-action="search-selection-google">
                    <i class="fa-brands fa-google" aria-hidden="true"></i>
                    <span>Google</span>
                </button>
                <button type="button" data-action="search-selection-brave">
                    <i
                        class="fa-solid fa-magnifying-glass"
                        aria-hidden="true"
                    ></i>
                    <span>Brave</span>
                </button>
            </div>
        </div>

        <div class="toast" data-toast role="status" aria-live="polite"></div>
        <div class="page-load-mask" data-page-load-mask aria-hidden="true">
            <img class="page-load-logo" src="" alt="" data-page-load-logo />
        </div>
    </body>
</html>
